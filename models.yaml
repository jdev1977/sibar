      default_max_tokens: >-
        Documented as "64K" in thinking mode at the default effort; the exact
        integer is not stated.
      retirement_date: None announced.
      retirement_not_before: No earliest date is promised.
      snapshot: >-
        Served version on the check date was DeepSeek-V4-Pro-0813. The API ID
        carries no version, so record the version each run reports.

