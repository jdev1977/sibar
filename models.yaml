      - https://developers.openai.com/api/docs/deprecations
      - https://developers.openai.com/api/reference/resources/responses/methods/create
    date_checked: 2026-11-25
    notes:
      price: >-
        Requests over 272K input tokens cost 0.20 input and 0.75 output.
      temperature: >-
        The GPT-6 guide says to remove temperature and top_p when reasoning
        effort is not "none", and the default is "medium". The API reference
        gives a generic default of 1, not stated for this model.
      default_max_tokens: >-
        max_output_tokens is optional; the value applied when omitted is not
        stated.
      retirement_date: No shutdown date is listed on the deprecations page.
      retirement_not_before: >-
        No dated promise. Generally available models get at least 6 months'
        notice.
      api: Use the Responses API.

  - id: gemini-4-hydrogen
    provider: google
    tier: main
    display_name: Gemini 4 Hydrogen
    input_price_per_mtok_usd: 1.50
    output_price_per_mtok_usd: 7.50
    defaults:
      temperature: null
      thinking_on_by_default: true
      default_effort: high
      max_output_tokens: 65536
      default_max_tokens: 65536
      max_tokens_required: false
    retirement_date: null
    retirement_not_before: null
    api_key_env: GEMINI_API_KEY
    sources:
      - https://aistudio.google.com/docs/latest-model
      - https://aistudio.google.com/docs/models/gemini-4-hydrogen
      - https://aistudio.google.com/docs/thinking
      - https://aistudio.google.com/docs/text-generation
      - https://aistudio.google.com/docs/pricing
      - https://aistudio.google.com/docs/deprecations
    date_checked: 2026-11-25
    notes:
      temperature: >-
        Custom temperature, top_p and top_k are ignored on Gemini 4, with
        deprecation warnings; a later release will reject them. No default value
        is documented for this model.
      default_effort: Called "thinking level" by Google.
      max_output_tokens: >-
        Limit for synchronous requests without long decode, which allows up to
        1048576.
      max_tokens_required: >-
        Inferred: max_output_tokens is documented as an optional override.
      retirement_date: No shutdown date announced.
      retirement_not_before: No earliest date is promised.
      api: >-
        Current documentation uses the Interactions API; generateContent is
        labelled legacy. Provider also lists gemini-4-carbon and
        gemini-4-neon as flagship reasoning models; Hydrogen is its recommended
        starting model.

