# Website task: a pricing page for a software product.
# Kind: a commercial conversion page. Structured comparison of plans, prices
# and terms, with calls to sign up and a short FAQ.
# See prompts/website/README.md for the set, the rules and the version rule.
schema_version: 1
project_type: website
task_id: pricing-page
prompt_set_version: "1"
prompts:
  L0:
    A: Make a pricing page for a software product.
    B: Can you build a pricing page for a piece of software?
  L1:
    A: Make a pricing page for an invoicing tool for freelancers, so they can pick the plan that suits them.
    B: Can you build a pricing page for invoicing software aimed at freelancers? It should help them decide which of the plans is right for them.
  # L2 direction: an account-book feel (warm paper-cream background, dark green
  # ink, one book-style serif for all text, plans in one ruled comparison
  # table with equal weight, flat solid color, square corners), plain copy.
  # Points away from the expected pricing-page default: indigo or violet
  # gradients, a geometric sans, three rounded cards with soft shadows and a
  # highlighted "most popular" middle plan, hype copy.
  L2:
    A: |
      Make a pricing page for Billfinch, an invoicing tool for freelancers.

      Plans:
      - Starter: free forever. Up to 3 clients and 5 invoices a month, PDF invoices, and email support.
      - Solo: $9 a month, or $90 a year. Unlimited clients and invoices, recurring invoices, automatic payment reminders, and email support.
      - Studio: $24 a month, or $240 a year. Everything in Solo, plus up to 5 team members, time tracking, invoices in multiple currencies, and priority support.

      Terms for every plan: the paid plans come with a 30-day free trial, Starter needs no credit card, customers can cancel at any time, and Billfinch takes no fee on payments.

      FAQ, with three questions and these answers:
      - "Can I switch plans later?" Yes, at any time. The price is adjusted for the rest of the billing period.
      - "What happens to my invoices if I cancel?" You can export all of them as PDF or CSV, and they stay available for 90 days after you cancel.
      - "Do you take a cut of my payments?" No. Billfinch charges only the plan price.

      Required sections: a short heading and introduction, the plan comparison, the FAQ, and a closing line that invites questions to hello@example.com. Each plan needs a sign-up button: "Start free" for Starter, and "Start 30-day trial" for Solo and Studio.

      Tone: plain and honest. Describe each feature in everyday words, and claim only what a plan includes.

      Visual direction: an account-book feel. A warm paper-cream background with dark green ink, and one book-style serif for all text. Show the plans in a single comparison table with ruled lines, and give all three plans equal weight. Flat, solid color and square corners throughout.
    B: |
      Can you build a pricing page for Billfinch? It's an invoicing tool for freelancers, and it has three plans.

      Starter is free forever and covers up to 3 clients and 5 invoices a month, with PDF invoices and email support. Solo costs $9 a month, or $90 a year, and gives unlimited clients and invoices, recurring invoices, automatic payment reminders and email support. Studio costs $24 a month, or $240 a year, and has everything in Solo plus up to 5 team members, time tracking, invoices in multiple currencies and priority support.

      Some terms hold across all plans: there's a 30-day free trial on the paid ones, Starter needs no credit card, customers can cancel whenever they like, and Billfinch takes no fee on payments.

      We'd like an FAQ with three questions. "Can I switch plans later?" Yes, whenever you like, with the price adjusted for what's left of the billing period. "What happens to my invoices if I cancel?" They can all be exported as PDF or CSV, and they remain available for 90 days after canceling. "Do you take a cut of my payments?" No: the plan price is the only thing Billfinch charges.

      The page needs a short heading and introduction, a comparison of the plans, the FAQ and, to close, a line inviting questions to hello@example.com. Every plan needs its own sign-up button, labeled "Start free" for Starter and "Start 30-day trial" for Solo and Studio.

      Please keep the copy plain and honest: everyday words for each feature, and claims kept to what a plan includes. As for the look, think of an account book: a warm paper-cream page, dark green ink, and a single book-style serif for every bit of text. The plans belong in one comparison table with ruled lines, all three carrying equal weight. Color should be flat and solid everywhere, and every corner square.
notes: >-
  Leak check (T1.2), logged in leak-check.md. L0 pass. L1 A and B rewritten:
  "compare the plans" shares its root with a page pattern (comparison table)
  and "weigh up" is a British idiom in a US-spelling set. L2 A and B
  rewritten: the tone and visual lines now state what is wanted instead of
  naming what to avoid, B no longer fixes the order of the sections, B has
  the one "please" every L2 B has, and "labelled" and "cancelling" take their
  US spelling. "Credit card", "PDF" and "CSV" are page content.
