# Website task: a dashboard.
# Kind: data display. Key figures, a chart or two, warnings and notes, read
# at a glance by people at work.
# See prompts/website/README.md for the set, the rules and the version rule.
schema_version: 1
project_type: website
task_id: dashboard
prompt_set_version: "1"
prompts:
  L0:
    A: Make a dashboard web page.
    B: Can you build a web page that works as a dashboard?
  L1:
    A: Make a dashboard web page for the volunteers at a food bank, so they can see how the day's distribution is going.
    B: Can you build a web page that works as a dashboard for a food bank? Its volunteers want to know how the day's distribution is going.
  # L2 direction: light and editorial, like a printed report (warm white
  # background, dark gray text, serif numbers with old-style figures, charts
  # in one oxblood red with grays, hairline rules as the only dividers,
  # labels in words only, square corners). Also one realistic constraint: it
  # must work with no internet connection.
  # Points away from the expected dashboard default: a dark theme in slate or
  # navy, bright blue, green and violet accents, rounded KPI cards with icons,
  # a chart library loaded from the web.
  L2:
    A: |
      Make a dashboard web page for the volunteers at Ostrey Food Bank, so they can see how today's distribution is going.

      It must work on the old laptop at the front desk, which is often offline, so it cannot rely on an internet connection. Use the sample figures below for now; the page will be connected to live data later.

      Header: Ostrey Food Bank, Thursday, March 11, 2027, last updated 2:00pm.

      Key figures:
      - Households served so far: 86, out of 140 expected today
      - New registrations today: 7
      - Volunteers on shift: 14
      - Food parcels packed: 120
      - Donations received today: 312 kg

      Households served per hour so far, shown as a chart: 9am: 12; 10am: 21; 11am: 18; 12pm: 15; 1pm: 20.

      Stock levels as a percentage of target, with anything under 35% flagged as low:
      - Pasta and rice: 82%
      - Canned vegetables: 64%
      - Baby supplies: 58%
      - Breakfast cereal: 47%
      - Canned fish and meat: 31%
      - Toiletries: 22%

      Notes for today:
      - Chiller 2 is running warm, so dairy goes in chiller 1.
      - A donation pickup van arrives at 3:30pm and needs two volunteers to unload it.

      Required sections: header, key figures, households per hour, stock levels with the low ones flagged, notes.

      Tone: plain labels in everyday words.

      Visual direction: light and editorial, like a printed report. A warm white background with dark gray text. Numbers set in a serif with old-style figures. Charts in a single oxblood red with grays, drawn as simple bars. Separate the areas with thin hairline rules alone, and keep every corner square. Labels are words only.
    B: |
      Can you build a web page that works as a dashboard for Ostrey Food Bank? Our volunteers want to see how today's distribution is going.

      It has to run on the old laptop at the front desk, which is often offline, so it can't depend on an internet connection. For now, use the sample figures below; we'll connect it to live data later.

      At the top it should say Ostrey Food Bank, Thursday, March 11, 2027, last updated 2:00pm. The key figures are: 86 households served so far, out of 140 expected today; 7 new registrations today; 14 volunteers on shift; 120 food parcels packed; and 312 kg of donations received today.

      Please show households served per hour so far as a chart: 9am: 12; 10am: 21; 11am: 18; 12pm: 15; 1pm: 20.

      Any stock under 35% of its target should be flagged as low. The stock levels, as a percentage of target, are pasta and rice 82%, canned vegetables 64%, baby supplies 58%, breakfast cereal 47%, canned fish and meat 31%, and toiletries 22%.

      Today's notes: chiller 2 is running warm, so dairy goes in chiller 1; and a donation pickup van arrives at 3:30pm and needs two volunteers to unload it.

      So the page needs the header, the key figures, households per hour, the stock levels with the low ones flagged, and the notes. Keep the labels plain, in everyday words.

      As for the look, it should be light and editorial, in the manner of a printed report. Text in dark gray over a warm white background. Numbers in a serif, using old-style figures. Charts as plain bars in one oxblood red, plus grays. Thin hairline rules, and nothing else, to divide the areas; square corners wherever a corner appears; and labels in words alone.
notes: >-
  Leak check (T1.2), logged in leak-check.md. L0 pass. L1 A and B rewritten:
  "at a glance" and "a quick overview" describe how the page should read, which
  is a layout direction. L2 A and B rewritten: "at a glance" removed to match
  L1, the tone and visual lines now state what is wanted instead of naming
  what to avoid, and "grey" is spelled "gray" like the rest of the set. Kept:
  "cannot rely on an internet connection" (a need, and it names no
  technology).
