# Engineering task: a shelf bracket with a CAD file.
# Kind: a part to be drawn and made. Dimensions, load, material and making
# method assumed, CAD format, fixing to the wall, checks made.
# See prompts/engineering/README.md for the set, the rules and the version
# rule. Outputs are study data, not designs.
# Givens: none. Units: left open at L0 and L1, so the unit system, the
# dimensions and the load are all choices being measured.
# Checkable: L2 only. Moment where the bracket meets the wall: 40 lb at 5 in
# = 200 lb·in. The screw force and the plywood stress depend on the outline
# and screw spacing the model chooses; grade them against those.
# L2 gives US customary units, pointing away from the expected metric
# default.
schema_version: 1
project_type: engineering
task_id: shelf-bracket
prompt_set_version: "1"
prompts:
  L0:
    A: Design a shelf bracket and make a CAD file for it.
    B: Can you design a bracket to hold up a shelf, and give me a CAD file of it?
  L1:
    A: Design a shelf bracket for a homeowner who is putting up a kitchen shelf to hold a row of cookbooks, and make a CAD file for it.
    B: Can you design a bracket to hold up a shelf, and give me a CAD file of it? It's for a homeowner putting up a kitchen shelf that will hold a row of cookbooks.
  # L2 direction: US customary units, birch plywood cut on a laser cutter
  # that takes only flat outlines, a solid quarter-circle profile, two
  # screws into a stud, a stated working stress, dimensions to the nearest
  # 1/16 in.
  # Points away from the expected default: millimeters, a printed or bent
  # metal right-angle bracket with a straight diagonal brace, a 3D model
  # written as code, no stated load.
  L2:
    A: |
      Design a shelf bracket for a homeowner who is putting up a kitchen shelf to hold a row of cookbooks, and make a CAD file for it.

      Requirements:
      - The shelf is 10 in deep and 3/4 in thick. Two brackets hold it, and each carries 40 lb spread evenly over the shelf's depth.
      - Each bracket is fixed to a wall stud with two screws, one above the other.
      - It is cut from 1/4 in birch plywood on a laser cutter that takes only flat outlines, so the whole bracket is one flat piece.
      - The profile is a solid quarter circle: one straight edge against the wall, one straight edge under the shelf, and a curved edge between them.
      - Give all dimensions in inches, to the nearest 1/16 in.

      Give:
      - The outline as a CAD file the laser cutter can use, with the screw holes placed.
      - A dimensioned description of the outline.
      - The bending moment where the bracket meets the wall, and the pull-out force on the top screw.
      - The bending stress in the plywood at its weakest section, against a working stress of 1000 psi.
    B: |
      Can you design a bracket to hold up a shelf, and give me a CAD file of it? I'm a homeowner putting up a kitchen shelf that will hold a row of cookbooks.

      The shelf measures 10 in from front to back and is 3/4 in thick. It rests on two brackets, each taking 40 lb spread evenly from front to back. Every bracket goes into a wall stud with two screws, one placed above the other. I'll be cutting it out of 1/4 in birch plywood on a laser cutter that accepts flat outlines only, so each bracket must be a single flat piece. For its shape I want a solid quarter circle, with one straight edge on the wall, the other straight edge beneath the shelf and the curve joining them. Please dimension everything in inches, to the nearest 1/16 in.

      What I need back is the outline as a CAD file the laser cutter can take, with the screw holes in place, plus a description of the outline with its dimensions; the bending moment at the point where the bracket meets the wall; the pull-out force on the upper screw; and the bending stress in the plywood at its weakest section, set against a working stress of 1000 psi.
notes: >-
  Written for T2.1. "CAD file" is the task as the plan names it (shelf
  bracket with a CAD file): it says that a CAD file is wanted and leaves its
  format open, as "website" leaves the technology open. At L2 the laser
  cutter is a real constraint written as a need ("takes only flat
  outlines"), not as a format. The setting is a kitchen shelf of books,
  which is not safety-critical. The plywood is 1/4 in, a thickness common
  laser cutters take; the problem stays well posed, because the moment at
  the wall (200 lb·in) does not depend on thickness, and the stress check
  follows from the outline the model draws (a wall edge 8 in deep gives
  about 75 psi, far below the 1000 psi working stress).
