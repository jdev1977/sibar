<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture to-do list</title>
  <style>
    body { margin: 0; padding: 24px; font-family: sans-serif; background: white; color: #111; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
    li.overdue { color: #c0392b; font-weight: bold; }
    #added { animation: fade 3s ease-in both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <h1>To do</h1>
  <p id="today"></p>
  <ul id="tasks"></ul>
  <p id="added">Saved on this device.</p>
  <script src="app.js"></script>
</body>
</html>
