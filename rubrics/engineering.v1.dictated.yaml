# Which rubric items each engineering prompt takes out of the model's hands
# (T2.4). Companion of engineering.v1.yaml; checked by tagger/rubric.py.
#
# Same idea and same entry format as analysis/website/dictated.yaml, whose
# rules are in docs/metrics.md, "Open choices". An item is OPEN in a cell
# unless an entry here closes it for that task and level. Only open items
# count toward a default. The variable name of an item is
# rubric.engineering.<item id>, as the tags are stored
# (docs/record-format.md).
#
#   closed   the items an entry closes
#   reason   direction   the brief names the method or form wanted
#            content     the brief supplies the content that decides the answer
#            constraint  the brief states a technical need
#   quote    words of wording A at that level (one text or a list); a check
#            that the entry still matches the prompt
#   expect   optional, per item: what a run that followed the brief shows.
#            {in: [...]} for a single-select item; {present: [...]} and/or
#            {absent: [...]} for a multi-select item
#   note     why, and what to be careful about
#   associations   not closed: wording that may pull an open choice
#            (prompts/engineering/leak-check.md). Read the share beside it.
#
# L0 and L1 close nothing. Read from prompts/engineering/leak-check.md, "What
# each L2 dictates" and "Choices not to read as defaults", and from the L2
# texts. Every L2 states its assumptions and gives the inputs of one design,
# so assumptions_stated and result_form are closed there
# (docs/leak-check.md, rule 15) and read at L0 and L1 only.
#
# This file changes how tags are counted, not how they are made: changing an
# entry needs no new rubric version and no new tagging. When the type's
# features.yaml exists, its metrics_version covers these entries.
schema_version: 1
project_type: engineering
rubric: engineering.v1

tasks:
  cantilever-beam:
    prompt_set_version: "1"
    L2:
      - closed: [rubric.engineering.assumptions_stated, rubric.engineering.result_form]
        reason: content
        quote: "Assumptions set by the problem:"
        expect:
          rubric.engineering.result_form: {in: [one-worked]}
      - closed: [rubric.engineering.material_assumed, rubric.engineering.section_shape]
        reason: content
        quote: "The beam is a solid rectangular bar of 6061-T6 aluminum"
        expect:
          rubric.engineering.material_assumed: {in: [aluminum]}
          rubric.engineering.section_shape: {in: [solid-rectangle]}
      - closed: [rubric.engineering.safety_margin]
        reason: direction
        quote: "Use a safety factor of 3 on yield for the bending stress."
        expect:
          rubric.engineering.safety_margin: {in: [numeric]}
      - closed: [rubric.engineering.checks_performed]
        reason: direction
        quote:
          - "Use a safety factor of 3 on yield for the bending stress."
          - "The tip may deflect at most 15 mm."
        expect:
          rubric.engineering.checks_performed: {present: [strength, deflection]}
      - closed: [rubric.engineering.self_weight]
        reason: content
        quote: "The load at the free end is the only load on the beam."
        expect:
          rubric.engineering.self_weight: {in: [neglected-stated, not-mentioned]}
        note: >-
          The brief says what holds and does not name the beam's own weight
          (docs/leak-check.md, rule 15).
      - closed: [rubric.engineering.part_selection]
        reason: direction
        quote: "The smallest width and depth, in whole millimeters, that meet both limits"
        expect:
          rubric.engineering.part_selection: {in: [computed-size]}
      - closed: [rubric.engineering.formula_source]
        reason: direction
        quote: "name the textbook source of each one"
        expect:
          rubric.engineering.formula_source: {in: [named]}
      - closed: [rubric.engineering.answer_position]
        reason: direction
        quote: "Start with a one-line answer"
        expect:
          rubric.engineering.answer_position: {in: [before-working]}

  compression-spring:
    prompt_set_version: "1"
    L2:
      - closed: [rubric.engineering.assumptions_stated, rubric.engineering.result_form]
        reason: content
        quote: "Requirements:"
        expect:
          rubric.engineering.result_form: {in: [one-worked]}
      - closed: [rubric.engineering.material_assumed]
        reason: content
        quote: "the wire is type 302 stainless steel"
        expect:
          rubric.engineering.material_assumed: {in: [stainless-steel]}
      - closed: [rubric.engineering.design_load]
        reason: content
        quote: "it pushes back with 1.2 lbf"
        expect:
          rubric.engineering.design_load: {in: [numeric]}
      - closed: [rubric.engineering.safety_margin]
        reason: direction
        quote: "Keep the shear stress at the working length below 45% of the tensile strength."
        expect:
          rubric.engineering.safety_margin: {in: [numeric]}
      - closed: [rubric.engineering.checks_performed]
        reason: direction
        quote:
          - "Keep the shear stress at the working length below 45% of the tensile strength."
          - "It must last for 100,000 presses."
        expect:
          rubric.engineering.checks_performed: {present: [strength]}
        note: >-
          The brief asks whether the spring will last and why, which an
          answer can give in words. Only the stress check is judged.
      - closed: [rubric.engineering.answer_position]
        reason: direction
        quote: "Start with one table of the design values, then give the working."
        expect:
          rubric.engineering.answer_position: {in: [before-working]}

  conveyor-gear-ratio:
    prompt_set_version: "1"
    L2:
      - closed: [rubric.engineering.assumptions_stated, rubric.engineering.result_form]
        reason: content
        quote: "Drive details:"
        expect:
          rubric.engineering.result_form: {in: [one-worked]}
      - closed: [rubric.engineering.motor_speed_assumed]
        reason: content
        quote: "The motor is a 4-pole induction motor that turns at 1725 rpm under load."
        expect:
          rubric.engineering.motor_speed_assumed: {in: [near-1800]}
        note: >-
          Close to the expected default: a 4-pole motor is the motor most
          likely assumed at L0. Compliance can be read; do not read motor
          speed as a default that persists.
      - closed: [rubric.engineering.reduction_kind]
        reason: direction
        quote: "The reduction has two stages: a toothed belt from the motor, then a roller chain to the drum shaft."
        expect:
          rubric.engineering.reduction_kind: {in: [belt-or-chain]}
      - closed: [rubric.engineering.answer_position]
        reason: direction
        quote: "Start with a short table of the chosen tooth counts, then give the working."
        expect:
          rubric.engineering.answer_position: {in: [before-working]}
    associations:
      L0:
        - variables: [rubric.engineering.reduction_kind]
          quote: "gear ratio"
          note: >-
            The plan's noun leans toward gears at every level
            (docs/leak-check.md, rule 8). Read the share of open-gears and
            gearbox-unit as the default for a request that says "gear ratio".

  heat-sink:
    prompt_set_version: "1"
    L2:
      - closed: [rubric.engineering.assumptions_stated, rubric.engineering.result_form]
        reason: content
        quote: "Mounting details:"
        expect:
          rubric.engineering.result_form: {in: [one-worked]}
      - closed: [rubric.engineering.material_assumed, rubric.engineering.cooling_mode]
        reason: direction
        quote: "The heat sink is a flat, vertical copper plate, 3 mm thick, cooled by still air on both faces."
        expect:
          rubric.engineering.material_assumed: {in: [copper]}
          rubric.engineering.cooling_mode: {in: [natural]}
        note: >-
          Still air is close to the expected default. Compliance can be read
          for cooling_mode; do not read it as a default that persists. The
          copper plate is the choice that moves.
      - closed: [rubric.engineering.interface_resistance]
        reason: content
        quote: "A thermal pad between the transistor and the plate adds 0.3 °C/W."
        expect:
          rubric.engineering.interface_resistance: {in: [included]}
      - closed: [rubric.engineering.part_selection]
        reason: direction
        quote: "the side of the smallest square plate, rounded up to the next 5 mm"
        expect:
          rubric.engineering.part_selection: {in: [computed-size]}

  pipe-and-pump:
    prompt_set_version: "1"
    L2:
      - closed: [rubric.engineering.assumptions_stated, rubric.engineering.result_form]
        reason: content
        quote: "System details:"
        expect:
          rubric.engineering.result_form: {in: [one-worked]}
      - closed: [rubric.engineering.material_assumed]
        reason: content
        quote: "The pipe is black polyethylene."
        expect:
          rubric.engineering.material_assumed: {in: [plastic]}
        note: >-
          A smooth plastic pipe is also the expected default. Compliance can
          be read; do not read pipe material as a default that persists.
      - closed: [rubric.engineering.friction_method]
        reason: direction
        quote: "Use the Hazen-Williams equation with C = 140."
        expect:
          rubric.engineering.friction_method: {in: [hazen-williams]}
      - closed: [rubric.engineering.minor_losses]
        reason: content
        quote: "The fittings (a strainer, 4 elbows and a check valve) add the equivalent of 8 m of extra pipe."
        expect:
          rubric.engineering.minor_losses: {in: [included]}
      - closed: [rubric.engineering.answer_position]
        reason: direction
        quote: "Put the answers in a table first"
        expect:
          rubric.engineering.answer_position: {in: [before-working]}
    associations:
      L2:
        - variables: [rubric.engineering.pump_type]
          quote: "The pump runs from a 12 V battery charged by solar panels"
          note: >-
            The kind of pump is asked for and left open, but a 12 V supply
            narrows what can be bought. Read the L2 share with that in mind.

  shelf-bracket:
    prompt_set_version: "1"
    L2:
      - closed: [rubric.engineering.assumptions_stated, rubric.engineering.result_form]
        reason: content
        quote: "Requirements:"
        expect:
          rubric.engineering.result_form: {in: [one-worked]}
      - closed: [rubric.engineering.material_assumed, rubric.engineering.manufacturing_notes]
        reason: content
        quote:
          - "It is cut from 1/4 in birch plywood on a laser cutter that takes only flat outlines"
          - "held to it by two screws through the plywood"
        expect:
          rubric.engineering.material_assumed: {in: [wood]}
        note: >-
          The brief gives the making process and the fixing, so a response
          that repeats them is not volunteering them. No value is expected
          for manufacturing_notes.
      - closed: [rubric.engineering.bracket_form]
        reason: direction
        quote: "The profile is a solid quarter circle"
        expect:
          rubric.engineering.bracket_form: {in: [gusset-plate]}
      - closed: [rubric.engineering.design_load]
        reason: content
        quote: "each carries 40 lb spread evenly over the shelf's depth"
        expect:
          rubric.engineering.design_load: {in: [numeric]}
      - closed: [rubric.engineering.checks_performed, rubric.engineering.safety_margin]
        reason: direction
        quote: "The bending stress in the plywood at its weakest section, against a working stress of 1000 psi."
        expect:
          rubric.engineering.checks_performed: {present: [strength]}
        note: >-
          The brief gives a working stress, which already holds a margin. No
          value is expected for safety_margin.
      - closed: [rubric.engineering.part_selection]
        reason: direction
        quote: "Give all dimensions in inches, to the nearest 1/16 in."
        expect:
          rubric.engineering.part_selection: {in: [computed-size]}
